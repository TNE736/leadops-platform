[project]
name = "lqabr-integrations"
version = "0.1.0"
description = "LQABR_Integrations — CSV ingestion, validation and forwarding service (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
# App-style service (run with uvicorn), not an importable library —
# install pulls the dependencies only.
py-modules = []
